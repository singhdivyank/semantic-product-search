[loggers]
keys = root, airflow, sqlalchemy, uvicorn, app, pipeline
 
[handlers]
keys = console, file_rotating
 
[formatters]
keys = standard, json_like

[logger_root]
level    = WARNING
handlers = console

[logger_app]
level     = INFO
handlers  = console, file_rotating
qualname  = app
propagate = 0

[logger_pipeline]
level     = INFO
handlers  = console, file_rotating
qualname  = pipeline
propagate = 0

[logger_airflow]
level     = INFO
handlers  = console
qualname  = airflow
propagate = 0

[logger_sqlalchemy]
level     = WARNING
handlers  = console
qualname  = sqlalchemy.engine
propagate = 0

[logger_uvicorn]
level     = INFO
handlers  = console
qualname  = uvicorn
propagate = 0

[handler_console]
class     = StreamHandler
level     = DEBUG
formatter = standard
args      = (sys.stdout,)

[handler_file_rotating]
class    = logging.handlers.RotatingFileHandler
level    = INFO
formatter = json_like
args     = (os.environ.get("LOG_DIR", "/tmp") + "/semantic_search.log", "a", 10485760, 5, "utf-8")

[formatter_standard]
format   = %(asctime)s [%(levelname)-8s] %(name)s — %(message)s
datefmt  = %Y-%m-%d %H:%M:%S

# aggregators (Datadog, GCP Logging)
[formatter_json_like]
format   = %(asctime)s level=%(levelname)s logger=%(name)s module=%(module)s line=%(lineno)d msg=%(message)s
datefmt  = %Y-%m-%dT%H:%M:%S
