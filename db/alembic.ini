# Alembic configuration for the Semantic Product Search project.
# The database URL is injected dynamically in db/alembic/env.py from
# environment variables — the placeholder below is never used directly.

[alembic]
# Path to migration scripts, relative to this file's location
script_location    = db/alembic

# Prepend project root to sys.path so config/ and db/ are importable
prepend_sys_path   = .

# Alembic generates one file per revision
version_path_separator = os

# URL placeholder — overridden in env.py via os.environ
sqlalchemy.url = driver://user:pass@host/dbname

# Logging
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level    = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level    = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level    = INFO
handlers =
qualname = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format  = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S