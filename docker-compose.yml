# Services
# --------
#   postgres      PostgreSQL 16 + pgvector extension
#   api           FastAPI application (src/main.py)
#   airflow-init  One-shot: DB init + admin user creation
#   airflow-web   Airflow webserver  (port 8080)
#   airflow-sched Airflow scheduler
#   airflow-worker Airflow Celery worker
#   redis         Celery broker for Airflow
#   mlflow        MLflow tracking server (port 5000)
#   prometheus    Prometheus scraper  (port 9090)
#   grafana       Grafana dashboards  (port 3000)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: semantic-search:latest
  environment: &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        postgresql+psycopg2://${DB_USER}:${DB_PSWD}@postgres:${DB_PORT}/airflow
    AIRFLOW__CELERY__RESULT_BACKEND:            db+postgresql://${DB_USER}:${DB_PSWD}@postgres:${DB_PORT}/airflow
    AIRFLOW__CELERY__BROKER_URL:                redis://redis:6379/0
    AIRFLOW__CORE__EXECUTOR:                    CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY:                  ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY:                   ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
    AIRFLOW_HOME:                               /tmp/airflow
    DB_HOST:              postgres
    DB_PORT:              ${DB_PORT}
    DB_NAME:              ${DB_NAME}
    DB_USER:              ${DB_USER}
    DB_PASSWORD:          ${DB_PSWD}
    HF_API_TOKEN:         ${HF_API_TOKEN}
    MLFLOW_URI:  http://mlflow:5000
    MLFLOW_DIR: /mlflow/artifacts
    INGESTION_DATA_DIR:   /amazon-data
    PYTHONPATH:           /app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semantic_postgres
    environment:
      POSTGRES_USER:               ${DB_USER}
      POSTGRES_PASSWORD:           ${DB_PSWD}
      POSTGRES_DB:                 ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: semantic-search:latest
    container_name: semantic_api
    environment:
      DB_HOST:              postgres
      DB_PORT:              ${DB_PORT}
      DB_NAME:              ${DB_NAME}
      DB_USER:              ${DB_USER}
      DB_PASSWORD:          ${DB_PSWD}
      HF_API_TOKEN:         ${HF_API_TOKEN}
      MLFLOW_URI:  http://mlflow:5000
      MLFLOW_DIR: /mlflow/artifacts
      API_RELOAD:           "false"
      PYTHONPATH:           /app
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./db:/app/db
      - ./docker/scripts:/app/docker/scripts:ro
      - hf_cache:/app/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    command: ["/bin/sh", "/app/docker/scripts/start_api.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: semantic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: semantic_airflow_init
    command: ["/bin/sh", "/docker/scripts/airflow_init.sh"]
    volumes:
      - ./docker/scripts:/docker/scripts:ro
    restart: "no"

  airflow-web:
    <<: *airflow-common
    container_name: semantic_airflow_web
    command: ["sh", "-c", "mkdir -p /tmp/airflow && airflow api-server"]
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/tmp/airflow/dags
      - ./config:/tmp/airflow/config
      - airflow_logs:/tmp/airflow/logs
      - airflow_plugins:/tmp/airflow/plugins
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-sched:
    <<: *airflow-common
    container_name: semantic_airflow_scheduler
    command: airflow scheduler
    volumes:
      - ./dags:/tmp/airflow/dags
      - ./config:/tmp/airflow/config
      - airflow_logs:/tmp/airflow/logs
      - airflow_plugins:/tmp/airflow/plugins
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: semantic_airflow_worker
    command: ["sh", "-c", "mkdir -p /tmp/airflow && airflow celery worker"]
    environment:
      <<: *airflow-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ./dags:/tmp/airflow/dags
      - ./config:/tmp/airflow/config
      - airflow_logs:/tmp/airflow/logs
      - airflow_plugins:/tmp/airflow/plugins
      - ./amazon-data:/amazon-data:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mlflow:
    image: python:3.11.13-slim
    container_name: semantic_mlflow
    command: >-
      sh -c "pip install --quiet 'mlflow>=2.13.0' psycopg2-binary &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri postgresql://${DB_USER}:${DB_PSWD}@postgres:${DB_PORT}/mlflow
             --default-artifact-root /mlflow/artifacts
             --serve-artifacts"
    environment:
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PSWD}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: semantic_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: semantic_grafana
    environment:
      GF_SECURITY_ADMIN_USER:      ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:  ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:      "false"
      GF_DATASOURCES_DEFAULT_NAME: Prometheus
      GF_SERVER_ROOT_URL:          http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_home:
  airflow_logs:
  airflow_plugins:
  hf_cache:
  mlflow_artifacts:
  prometheus_data:
  grafana_data: